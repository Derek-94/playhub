# 로컬 개발용 Nakama + Postgres
# 실행: 루트에서 `npm run server:up` (또는 이 폴더에서 `docker compose up -d`)
# 관리자 콘솔: http://localhost:7351  (admin / password)

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nakama
      POSTGRES_PASSWORD: localdb
    volumes:
      - pgdata:/var/lib/postgresql/data # 컨테이너를 지워도 DB 데이터는 남음
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "nakama"]
      interval: 3s
      timeout: 3s
      retries: 10

  nakama:
    image: heroiclabs/nakama:3.41.0
    depends_on:
      postgres:
        condition: service_healthy # DB가 준비된 뒤에 Nakama 시작
    # 1) DB 테이블 준비(migrate) → 2) 서버 시작
    entrypoint:
      - /bin/sh
      - -ecx
      - >
        /nakama/nakama migrate up --database.address postgres:localdb@postgres:5432/nakama &&
        exec /nakama/nakama --name nakama1
        --database.address postgres:localdb@postgres:5432/nakama
        --logger.level DEBUG
        --session.token_expiry_sec 7200
        --runtime.js_entrypoint index.js
    volumes:
      # 서버 모듈 빌드 결과(modules/build/index.js)를 Nakama가 읽는 폴더에 연결
      # 모듈 수정 후: `npm run build -w server/modules` → `npm run server:restart`
      - ./modules/build:/nakama/data/modules
    ports:
      - "7349:7349" # gRPC (안 씀)
      - "7350:7350" # HTTP/WebSocket API ← SDK가 부르는 주소
      - "7351:7351" # 관리자 콘솔
    healthcheck:
      test: ["CMD", "/nakama/nakama", "healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
